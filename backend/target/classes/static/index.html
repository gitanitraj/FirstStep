<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Step</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

    <section id="home-screen"> 
        <header class="hero">
        <h1>First Step</h1>

        <p class="tagline">
            Your trusted local guidance for Wilmington, Delaware
        </p>
    </header>

    <section class="welcome">
        <h2>What do you need help with today?</h2>
    </section>

    <section class="category-list">

        <button id="housing-help-button" class="category-card">
            <span class="category-icon">🏠</span>
            <div class="category-text">
                <h3>Housing Help</h3>
                <p>Home and Rental Assistance, Shelters, Home Repairs</p>
            </div>
        </button>

        <button id="essentials-button" class="category-card">
            <span class="category-icon">🛒</span>
            <div class="category-text">
                <h3>Free / Low-Cost Essentials</h3>
                <p>Food, Furniture, Clothing</p>
            </div>
        </button>

        <button id="seasonal-resources-button" class="category-card">
            <span class="category-icon">🍂</span>
            <div class="category-text">
                <h3>Seasonal Resources</h3>
                <p>Programs, Events and Community Opportunities</p>
            </div>
        </button>

        <button id="weekly-updates-button" class="category-card">
            <span class="category-icon">📰</span>
            <div class="category-text">
                <h3>Weekly Updates</h3>
                <p>News and Changes Impacting You</p>
            </div>
        </button>

    </section>
    </section>

    <section id="filter-screen" style="display:none;">

        <h2>Housing Help</h2>

        <p>What matters most right now?</p>

        <div class="filter-options">

            <button id="urgent-filter" class="filter-chip">Urgent</button>

            <button class="filter-chip">Easy to Access</button>

            <button class="filter-chip">Free / Low-Cost</button>

        </div>

        <button id="continue-button">
            Continue
        </button>

    </section>

    <section id="results-screen" style="display:none;">

    <button id="back-home-button" class="back-button">
        ← Back to Home
    </button>

    <section id="results"></section>
    
    <section id="detail-screen" style="display:none;">
    
    <button id="back-results-button" class="back-button">
        ← Back to Results
    </button>
    
    <section id="detail-view"></section>
    </section>

    <section id="news-results"></section>
    <section id="essentials-results"></section>
    <section id="seasonal-results">
        <h2>🍂 Seasonal Resources</h2>
        <p style="color:#555; margin-bottom:12px;">
            Programs, events, and community opportunities near you.
        </p>
        <div class="carousel" id="seasonal-carousel"></div>
    </section>

    </section>

</main>

    <script src="app.js"></script>

</body>
</html>
