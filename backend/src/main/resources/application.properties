server.port=8080
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

# Filesystem locations (relative to the working directory by default).
# Override these when running from a different directory, e.g. in a container.
app.data.dir=app/data
app.seasonal.images.dir=backend/src/main/resources/static/images/seasonal

# Feature flag to prevent blocking UI when no AI provider is configured/available.
# No Spring AI model-provider starter is on the classpath yet (see
# ai/service/SpringAiAssistant.java) — AiAssistant.generate() throws
# AiProviderNotConfiguredException, which DecisionAgentService already
# catches and falls back to a canned response, same as before this migration.
ai.enabled=true

# RSS feeds for Weekly Updates (comma-separated)
news.rss.urls=https://legis.delaware.gov/rss/RssFeeds/GovernorSignedLegislation
# Refresh interval in milliseconds (3600000 = 1 hour)
news.rss.refresh-interval=3600000
# Initial delay before first fetch in milliseconds (500 = 0.5 seconds)
news.rss.initial-delay=500



